<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding Day — Павел & Елена</title>

<!-- Красивые шрифты: Parisienne (каллиграфия) + Bodoni Moda (имена, italic) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400;1,6..96,500&display=swap" rel="stylesheet">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  /* ===== Первый экран ===== */
  .hero {
    position: relative;
    width: 100%;
    height: 100vh;
    min-height: 600px;

    /* Картинка 1.png как фон (без затемнения) */
    background-image: url('1.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;

    overflow: hidden;
  }

  .hero-content {
    position: relative;
    z-index: 2;
    padding: 20px;
    transform: rotate(-2deg); /* лёгкий наклон всей композиции */
  }

  /* ===== "Wedding Day" — изящная каллиграфия ===== */
  .wedding-day {
    font-family: 'Parisienne', cursive;
    font-size: clamp(4rem, 15vw, 10rem);
    color: #ffffff;
    line-height: 1;
    letter-spacing: 0.02em;
    text-shadow: 0 2px 16px rgba(0, 0, 0, 0.35);
    margin-bottom: 0.15em;
    display: inline-block;
    transform: rotate(-3deg);
  }

  /* Тонкая линия-разделитель */
  .divider {
    width: 110px;
    height: 1px;
    background: rgba(255, 255, 255, 0.75);
    margin: 14px auto 26px;
  }

  /* ===== Имена — Bodoni Moda italic ===== */
  .names {
    font-family: 'Bodoni Moda', serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(1.8rem, 6vw, 3.8rem);
    color: #ffffff;
    letter-spacing: 0.12em;
    text-shadow: 0 2px 16px rgba(0, 0, 0, 0.35);
    margin-bottom: 0.7em;
    display: inline-block;
    transform: rotate(-1.5deg);
  }

  .names .amp {
    display: inline-block;
    font-style: italic;
    font-weight: 500;
    opacity: 0.9;
    margin: 0 0.25em;
  }

  /* ===== Дата ===== */
  .date {
    font-family: 'Bodoni Moda', serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(1rem, 2.6vw, 1.5rem);
    color: #ffffff;
    letter-spacing: 0.35em;
    text-shadow: 0 2px 16px rgba(0, 0, 0, 0.35);
  }

  /* ===== Плавное поочерёдное появление ===== */
  .wedding-day, .divider, .names, .date {
    opacity: 0;
    transition: opacity 1.2s ease, transform 1.2s ease;
  }

  .wedding-day { transform: rotate(-3deg) translateY(30px); }
  .divider     { transform: translateY(30px); }
  .names       { transform: rotate(-1.5deg) translateY(30px); }
  .date        { transform: translateY(30px); }

  .wedding-day.visible { opacity: 1; transform: rotate(-3deg) translateY(0); }
  .divider.visible     { opacity: 1; transform: translateY(0); }
  .names.visible       { opacity: 1; transform: rotate(-1.5deg) translateY(0); }
  .date.visible        { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>

  <section class="hero">
    <div class="hero-content">
      <h1 class="wedding-day">Wedding Day</h1>
      <div class="divider"></div>
      <h2 class="names">
        Павел <span class="amp">&amp;</span> Елена
      </h2>
      <p class="date">01 / 12 / 2027</p>
    </div>
  </section>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const items = document.querySelectorAll('.wedding-day, .divider, .names, .date');
      items.forEach((el, i) => {
        setTimeout(() => el.classList.add('visible'), 300 + i * 400);
      });
    });
  </script>

</body>
</html>
