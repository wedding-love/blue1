<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Wedding Day — Павел & Елена</title>

<!-- Новые красивые шрифты:
     Alex Brush  — нежная каллиграфия для "Wedding Day"
     Cinzel      — элегантный антиквенный serif для имён
     Cormorant Garamond — для даты -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    background: #1a1a1a;
  }

  /* ===== Первый экран — адаптивный ===== */
  .hero {
    position: relative;
    width: 100%;
    /* dvh — правильная высота на мобильных (учёт адресной строки) */
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  /* Фон-картинка: тянется на весь экран, работает на всех устройствах */
  .hero-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    z-index: 0;
    user-select: none;
    pointer-events: none;
  }

  .hero-content {
    position: relative;
    z-index: 2;
    padding: 5vmin 4vmin;
    max-width: 95%;
    transform: rotate(-2deg);
  }

  /* ===== "Wedding Day" — каллиграфия с анимацией ===== */
  .wedding-day {
    font-family: 'Alex Brush', cursive;
    font-size: clamp(4rem, 15vw, 10rem);
    color: #ffffff;
    line-height: 1;
    letter-spacing: 0.02em;
    text-shadow: 0 3px 20px rgba(0, 0, 0, 0.45);
    display: inline-block;
    opacity: 0;
    transform: rotate(-3deg) scale(0.92);
    filter: blur(12px);
    animation: weddingIn 2s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
  }

  @keyframes weddingIn {
    0%   { opacity: 0; filter: blur(12px); letter-spacing: -0.05em;
           transform: rotate(-3deg) scale(0.92); }
    60%  { opacity: 1; filter: blur(0); }
    100% { opacity: 1; filter: blur(0); letter-spacing: 0.02em;
           transform: rotate(-3deg) scale(1); }
  }

  /* Тонкая линия-разделитель */
  .divider {
    width: 110px;
    max-width: 40%;
    height: 1px;
    background: rgba(255, 255, 255, 0.8);
    margin: 1.2vmin auto 2.4vmin;
    opacity: 0;
    transform: scaleX(0);
    animation: lineIn 1.2s ease-out 1.1s forwards;
  }

  @keyframes lineIn {
    to { opacity: 1; transform: scaleX(1); }
  }

  /* ===== Имена — Cinzel + анимация по буквам ===== */
  .names {
    font-family: 'Cinzel', serif;
    font-weight: 400;
    font-size: clamp(1.6rem, 5.4vw, 3.6rem);
    color: #ffffff;
    letter-spacing: 0.18em;
    text-shadow: 0 2px 16px rgba(0, 0, 0, 0.45);
    margin-bottom: 1.4vmin;
    display: inline-block;
    transform: rotate(-1.5deg);
  }

  .names .letter {
    display: inline-block;
    opacity: 0;
    transform: translateY(35px) rotate(-6deg);
    filter: blur(6px);
    animation: letterIn 0.9s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
  }

  .names .letter.amp {
    font-family: 'Alex Brush', cursive;
    font-weight: 400;
    font-size: 1.25em;
    vertical-align: middle;
    letter-spacing: 0;
    margin: 0 0.15em;
    text-shadow: 0 0 22px rgba(255, 255, 255, 0.5);
  }

  @keyframes letterIn {
    to {
      opacity: 1;
      transform: translateY(0) rotate(0);
      filter: blur(0);
    }
  }

  /* ===== Дата — Cormorant Garamond italic ===== */
  .date {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(1rem, 2.6vw, 1.5rem);
    color: #ffffff;
    letter-spacing: 0.3em;
    text-shadow: 0 2px 14px rgba(0, 0, 0, 0.45);
    opacity: 0;
    transform: translateY(20px);
    animation: dateIn 1.4s ease-out 2.6s forwards;
  }

  @keyframes dateIn {
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===== Адаптивность ===== */

  /* Планшеты / небольшие ноутбуки */
  @media (max-width: 1024px) {
    .wedding-day { font-size: clamp(3.5rem, 18vw, 8rem); }
    .names       { font-size: clamp(1.5rem, 6vw, 3rem); }
  }

  /* Мобильные */
  @media (max-width: 640px) {
    .hero-content { transform: rotate(-1.5deg); }
    .wedding-day  { font-size: clamp(3.2rem, 22vw, 6.5rem); }
    .names        { font-size: clamp(1.3rem, 8vw, 2.4rem); letter-spacing: 0.12em; }
    .date         { font-size: clamp(0.9rem, 4vw, 1.2rem); letter-spacing: 0.22em; }
    .divider      { width: 70px; }
  }

  /* Очень узкие экраны */
  @media (max-width: 380px) {
    .wedding-day { font-size: clamp(2.6rem, 24vw, 5rem); }
    .names       { font-size: clamp(1.1rem, 8vw, 1.8rem); }
  }

  /* Горизонтальная ориентация на телефоне */
  @media (max-height: 480px) and (orientation: landscape) {
    .wedding-day { font-size: clamp(2.5rem, 12vh, 5rem); }
    .names       { font-size: clamp(1.1rem, 5vh, 2rem); }
    .date        { font-size: clamp(0.85rem, 3vh, 1.1rem); }
    .divider     { margin: 1vmin auto 1.6vmin; }
  }

  /* Уважать настройки пользователя (отключить анимацию) */
  @media (prefers-reduced-motion: reduce) {
    .wedding-day, .divider, .names .letter, .date {
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
      filter: none !important;
    }
  }
</style>
</head>
<body>

  <section class="hero">
    <!-- Фон через <img> — лучший способ для адаптивности на всех устройствах -->
    <img class="hero-bg" src="1.png" alt="Wedding background">

    <div class="hero-content">
      <h1 class="wedding-day">Wedding Day</h1>
      <div class="divider"></div>
      <h2 class="names" data-text="Павел &amp; Елена">Павел &amp; Елена</h2>
      <p class="date">01 / 12 / 2027</p>
    </div>
  </section>

  <script>
    // ====== Разбиваем имена на буквы и ставим задержки анимации ======
    document.addEventListener('DOMContentLoaded', () => {
      const namesEl = document.querySelector('.names');
      const text = namesEl.textContent.trim();   // "Павел & Елена"
      namesEl.textContent = '';

      const startDelay = 1.35;   // после линии
      const step = 0.07;         // задержка между буквами

      [...text].forEach((ch, i) => {
        const span = document.createElement('span');
        span.classList.add('letter');

        if (ch === '&') {
          span.classList.add('amp');
          span.textContent = '&';
        } else if (ch === ' ') {
          span.innerHTML = '&nbsp;';
          span.style.animation = 'none';   // пробел не анимируем
          span.style.opacity = '1';
          span.style.transform = 'none';
        } else {
          span.textContent = ch;
        }

        span.style.animationDelay = `${startDelay + i * step}s`;
        namesEl.appendChild(span);
      });
    });
  </script>

</body>
</html>
